services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dst
      POSTGRES_PASSWORD: dst
      POSTGRES_DB: dst_airlines
    ports:
      - "5432:5432"
    volumes:
      - dst_airlines_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dst -d dst_airlines"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dst:dst@db:5432/dst_airlines
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models

  dashboard:
    build:
      context: .
      dockerfile: infra/Dockerfile.dashboard
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dst:dst@db:5432/dst_airlines
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8050:8050"
    volumes:
      - ./models:/app/models

  collector:
    build:
      context: .
      dockerfile: infra/Dockerfile.collector
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dst:dst@db:5432/dst_airlines
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  dst_airlines_db_data:
